  <style>
    .contact-wrap { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: 36px; align-items: center; }
    .contact-info { min-width: 0; }
    .contact-list { display: flex; flex-direction: column; gap: 16px; }

    .c-item { position: relative; }
    .c-item .link-card { padding-right: 104px; }
    .c-item .link-card strong { font-size: 17px; }
    .c-item .link-card small { font-size: 15px; letter-spacing: .3px; word-break: break-all; }
    .c-item .ic svg { width: 26px; height: 26px; fill: none; stroke: var(--cerise); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .c-item .link-card:hover .ic { transform: rotate(-8deg) scale(1.08); }
    .c-item .ic { transition: transform .3s cubic-bezier(.3, 1.6, .5, 1); }
    .copy {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      padding: 8px 16px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--glass-border); background: rgba(255,255,255,.2); color: #fff;
      font: 600 13px "Poppins", sans-serif; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      transition: background .25s, color .25s, transform .25s;
    }
    .copy:hover { background: #fff; color: var(--cerise); transform: translateY(-50%) scale(1.06); }
    .copy.done { background: var(--morning-glory); color: #2a0f4d; border-color: transparent; }

    .collab { margin-top: 34px; font-size: clamp(22px, 3.1vw, 32px); font-weight: 700; line-height: 1.3; text-shadow: 0 4px 22px rgba(42,15,77,.35); }
    .collab .ch { display: inline-block; opacity: 0; transform: translateY(18px) scale(.6); will-change: transform, opacity; }
    .collab .ch.sp { width: .28em; }
    .collab .w { display: inline-block; white-space: nowrap; }
    .collab .hl { color: var(--brulee); }
    .collab-line { display: block; width: min(320px, 70%); height: 10px; margin-top: 10px; overflow: visible; }
    .collab-line path { fill: none; stroke: var(--morning-glory); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 340; stroke-dashoffset: 340; }

    .stage { position: relative; justify-self: center; height: min(62vh, 540px); aspect-ratio: 672 / 1123; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .stage canvas, .stage .char-fallback { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .floor {
      position: absolute; width: 46%; height: 3.2%; left: 30%; top: 89.5%;
      background: radial-gradient(ellipse at center, rgba(42,15,77,.5), rgba(42,15,77,0) 70%);
      filter: blur(3px); pointer-events: none; transform-origin: 50% 50%;
    }
    .char-fallback { object-fit: contain; animation: fbSway 3.4s ease-in-out infinite; transform-origin: 30% 95%; }
    @keyframes fbSway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    .hint { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; opacity: .7; white-space: nowrap; pointer-events: none; transition: opacity .6s; }

   
    #toast {
      position: fixed; left: 50%; bottom: 36px; z-index: 120; padding: 12px 22px; border-radius: 999px;
      background: var(--glass-strong); border: 1px solid var(--glass-border); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      font-weight: 600; pointer-events: none; opacity: 0; transform: translate(-50%, 24px) scale(.9);
    }

    @media (max-width: 860px) {
      .contact-wrap { grid-template-columns: 1fr; gap: 10px; }
      .stage { order: -1; height: min(50vh, 420px); }
      .collab { margin-top: 26px; }
    }
  </style>

  <script>
  
  document.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest('a[href^="tel:"], a[href^="mailto:"]');
    if (a) e.stopImmediatePropagation();
  }, true);


  (function () {
    const toast = document.getElementById("toast");
    let toastAnim = null;
    function showToast(msg) {
      toast.textContent = msg;
      if (toastAnim) toastAnim.cancel();
      toastAnim = toast.animate([
        { opacity: 0, transform: "translate(-50%, 24px) scale(.9)" },
        { opacity: 1, transform: "translate(-50%, 0) scale(1.06)", offset: .35 },
        { opacity: 1, transform: "translate(-50%, 0) scale(1)", offset: .5 },
        { opacity: 1, transform: "translate(-50%, 0) scale(1)", offset: .85 },
        { opacity: 0, transform: "translate(-50%, -12px) scale(.96)" }
      ], { duration: 1700, easing: "ease-out", fill: "forwards" });
    }
    async function copyText(t) {
      try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
      try {                                           // older browsers / local files
        const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok;
      } catch (e) { return false; }
    }
    document.querySelectorAll(".copy").forEach((btn) => btn.addEventListener("click", async () => {
      const ok = await copyText(btn.dataset.copy);
      showToast(ok ? btn.dataset.msg : "Couldn't copy, sorry!");
      if (ok) { btn.classList.add("done"); btn.textContent = "Copied"; setTimeout(() => { btn.classList.remove("done"); btn.textContent = "Copy"; }, 1500); }
      window.dispatchEvent(new CustomEvent("char-happy"));
    }));
  })();

 
  (function () {
    const el = document.getElementById("collab");
    const line = document.getElementById("collabLine");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function split(node) {
      [...node.childNodes].forEach((n) => {
        if (n.nodeType === 3) {
          const frag = document.createDocumentFragment();
          n.textContent.split(/(\s+)/).forEach((word) => {
            if (!word) return;
            if (/^\s+$/.test(word)) { const s = document.createElement("span"); s.className = "ch sp"; s.textContent = "\u00A0"; frag.appendChild(s); return; }
            const w = document.createElement("span"); w.className = "w";
            [...word].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.textContent = c; w.appendChild(s); });
            frag.appendChild(w);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1) split(n);
      });
    }
    split(el);
    const chars = [...el.querySelectorAll(".ch")];
    const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
    function play() {
      const t0 = performance.now(), DELAY = 38, DUR = 520;
      (function step(now) {
        const t = now - t0; let done = true;
        chars.forEach((c, i) => {
          const p = Math.min(1, Math.max(0, (t - i * DELAY) / DUR));
          if (p < 1) done = false;
          const e = easeOutBack(p);
          c.style.opacity = Math.min(1, p * 3);
          c.style.transform = `translateY(${(1 - e) * 18}px) scale(${.6 + .4 * e})`;
        });
        const lp = Math.min(1, Math.max(0, (t - chars.length * DELAY * 0.6) / 900));
        line.style.strokeDashoffset = 340 * (1 - (1 - Math.pow(1 - lp, 3)));
        if (!done || lp < 1) requestAnimationFrame(step);
        else startWiggle();
      })(t0);
    }
  
    function startWiggle() {
      if (reduce) return;
      const hl = [...el.querySelectorAll(".hl .ch")];
      (function loop(now) {
        const t = now / 1000;
        hl.forEach((c, i) => { c.style.transform = `translateY(${Math.sin(t * 2.4 + i * 0.5) * 2.6}px)`; });
        requestAnimationFrame(loop);
      })(performance.now());
    }
    if (reduce) { chars.forEach((c) => { c.style.opacity = 1; c.style.transform = "none"; }); line.style.strokeDashoffset = 0; return; }
    setTimeout(play, 900);
  })();

      { pts: [[335, 228], [395, 150], [458, 82], [500, 22]], rIn: 38, rOut: 66, ramp: 70, bones: [2, 3, 4] },
      { pts: [[218, 258], [150, 308], [95, 342], [8, 388]],  rIn: 34, rOut: 60, ramp: 70, bones: [5, 6, 6] },
      { pts: [[305, 455], [205, 555], [150, 520], [55, 503]], rIn: 40, rOut: 68, ramp: 90, bones: [7, 8, 8] }
    ];
    const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
    CHAINS.forEach((c) => {
      c.len = []; c.cum = [0];
      for (let k = 0; k < c.pts.length - 1; k++) {
        const l = Math.hypot(c.pts[k + 1][0] - c.pts[k][0], c.pts[k + 1][1] - c.pts[k][1]);
        c.len.push(l); c.cum.push(c.cum[k] + l);
      }
    });

    function vertexWeights(x, y) {
      const w = new Float32Array(NB);
     
      CHAINS.forEach((c) => {
        let best = 1e9, bs = 0;
        for (let k = 0; k < c.len.length; k++) {
          const ax = c.pts[k][0], ay = c.pts[k][1];
          const bx = c.pts[k + 1][0] - ax, by = c.pts[k + 1][1] - ay;
          const u = Math.min(1, Math.max(0, ((x - ax) * bx + (y - ay) * by) / (bx * bx + by * by)));
          const d = Math.hypot(x - (ax + bx * u), y - (ay + by * u));
          if (d < best) { best = d; bs = c.cum[k] + u * c.len[k]; }
        }
        const infl = (1 - smooth(c.rIn, c.rOut, best)) * smooth(0, c.ramp, bs);
        if (infl <= 0) return;
        const j1 = c.cum[1], j2 = c.cum[2], bw = 20;
        const s1 = smooth(j1 - bw, j1 + bw, bs), s2 = smooth(j2 - bw, j2 + bw, bs);
        w[c.bones[0]] += infl * (1 - s1);
        w[c.bones[1]] += infl * s1 * (1 - s2);
        w[c.bones[2]] += infl * s2;
      });
      
      const hx = (x - 235) / 140, hy = (y - 120) / 135;
      const hr = Math.hypot(hx, hy);
      w[1] += (1 - smooth(0.9, 1.25, hr)) * (1 - smooth(205, 250, y));
      
      let sum = 0; for (let i = 1; i < NB; i++) sum += w[i];
      if (sum > 1) { for (let i = 1; i < NB; i++) w[i] /= sum; sum = 1; }
      w[0] = 1 - sum;
      return w;
    }

    
    const COLS = Math.ceil(IW / CELL), ROWS = Math.ceil(IH / CELL);
    const NV = (COLS + 1) * (ROWS + 1);
    const rest = new Float32Array(NV * 2), uvs = new Float32Array(NV * 2), W = new Float32Array(NV * NB);
    for (let j = 0, v = 0; j <= ROWS; j++) for (let i = 0; i <= COLS; i++, v++) {
      const x = Math.min(IW, i * CELL), y = Math.min(IH, j * CELL);
      rest[v * 2] = x; rest[v * 2 + 1] = y; uvs[v * 2] = x / IW; uvs[v * 2 + 1] = y / IH;
      W.set(vertexWeights(x, y), v * NB);
    }
    const pos = new Float32Array(NV * 2);
    let indexCount = 0, texReady = false, glReady = false;
    let ibuf, pbuf, tex, prog, locView, aPos, aUV;

    
    const mul = (m, n) => [
      m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1],
      m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3],
      m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
    const rotAbout = (ang, p) => {
      const c = Math.cos(ang), s = Math.sin(ang);
      return [c, s, -s, c, p[0] - (c * p[0] - s * p[1]), p[1] - (s * p[0] + c * p[1])];
    };

    
    const clamp01 = (x) => Math.min(1, Math.max(0, x));
    const easeInOutCubic = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    const easeOutQuad = (x) => 1 - (1 - x) * (1 - x);
    const easeInQuad = (x) => x * x;

    
    let waveStart = -99, jump = null, headCur = 0, headTarget = 0, mouse = null, lastHop = -9;
    const WAVE_DUR = 3.1;
    function startWave(t) { waveStart = t; }
    function startJump(t, H, big) { jump = { t0: t, H, big }; }

    function pose(t) {
      const sw = Math.sin(t * 1.05);
      const a = new Array(NB).fill(0);
      let root = 1.6 * D * sw;                     
      a[0] = -1.1 * D * Math.sin(t * 1.05 - 0.6); 
      a[1] = 3.2 * D * Math.sin(t * 1.05 - 1.3) + headCur;   
      a[2] = 2.5 * D * Math.sin(t * 1.3 + 0.4);
      a[3] = 6 * D * Math.sin(t * 1.3 + 1.0);
      a[4] = 9 * D * Math.sin(t * 1.3 + 1.6);
      a[5] = 4 * D * Math.sin(t * 1.05 + 1.8);
      a[6] = 7 * D * Math.sin(t * 1.05 + 2.4);
      a[7] = 3.5 * D * Math.sin(t * 1.05 + 2.8);
      a[8] = 6 * D * Math.sin(t * 1.05 + 3.4);

      // the wave
      const wt = t - waveStart;
      if (wt >= 0 && wt < WAVE_DUR) {
        const p = wt / WAVE_DUR;
        const e = easeInOutCubic(clamp01(p / 0.16)) * (1 - easeInOutCubic(clamp01((p - 0.84) / 0.16)));
        const ph = wt * Math.PI * 2 * 2.7;
        a[2] += e * -9 * D + e * 5 * D * Math.sin(ph);          
        a[3] += e * 24 * D * Math.sin(ph - 0.5);                
        a[4] += e * 20 * D * Math.sin(ph - 1.1);                
        a[1] += e * -5 * D * Math.sin(ph * 0.5);                 
        a[5] += e * 6 * D;                                       
        root += e * 1.2 * D * Math.sin(ph * 0.5 + 1);
      }

     
      let dy = 0, sx = 1, sy = 1, air = 0;
      if (jump) {
        const jt = t - jump.t0, H = jump.H;
        if (jt < 0.14)      { const p = easeInOutCubic(jt / 0.14); sy = 1 - 0.07 * p; }                
        else if (jt < 0.50) { const p = (jt - 0.14) / 0.36; dy = -H * easeOutQuad(p); sy = 0.93 + 0.12 * easeOutQuad(p); air = p; }
        else if (jt < 0.80) { const p = (jt - 0.50) / 0.30; dy = -H * (1 - easeInQuad(p)); sy = 1.05 - 0.05 * p; air = 1 - p; }
        else if (jt < 1.45) { const r = jt - 0.80; sy = 1 - 0.075 * Math.exp(-6 * r) * Math.cos(17 * r); } 
        else jump = null;
        sx = 1 / sy;
        if (jump && jump.big) {
          a[2] += air * -14 * D; a[3] += air * 10 * D * Math.sin(jt * 30);
          a[5] += air * -16 * D; a[6] += air * -10 * D * Math.sin(jt * 30 + 1);
          a[7] += air * 8 * D;  a[8] += air * 18 * D;
          a[1] += air * -4 * D;
        }
      }

     
      const rootM = mul([1, 0, 0, 1, 0, J.feet[1] * 0], [1, 0, 0, 1, 0, 0]);
      let R = rotAbout(root, J.feet);
     
      const S = [sx, 0, 0, sy, J.feet[0] - sx * J.feet[0], J.feet[1] - sy * J.feet[1] + dy];
      R = mul(S, R);
      const Wm = new Array(NB);
      for (let i = 0; i < NB; i++) {
        const L = rotAbout(a[i], BONES[i].pivot);
        Wm[i] = BONES[i].parent < 0 ? mul(R, L) : mul(Wm[BONES[i].parent], L);
      }
      return { Wm, dy, sy };
    }

    function skin(Wm) {
      for (let v = 0; v < NV; v++) {
        const x = rest[v * 2], y = rest[v * 2 + 1];
        let px = 0, py = 0;
        for (let b = 0; b < NB; b++) {
          const w = W[v * NB + b]; if (w < 0.0005) continue;
          const m = Wm[b];
          px += w * (m[0] * x + m[2] * y + m[4]);
          py += w * (m[1] * x + m[3] * y + m[5]);
        }
        pos[v * 2] = px + PAD; pos[v * 2 + 1] = py + PAD;
      }
    }

    
    const VS = "attribute vec2 aPos; attribute vec2 aUV; uniform vec2 uView; varying vec2 vUV;" +
               "void main(){ vUV = aUV; gl_Position = vec4(aPos.x / uView.x * 2.0 - 1.0, 1.0 - aPos.y / uView.y * 2.0, 0.0, 1.0); }";
    const FS = "precision mediump float; varying vec2 vUV; uniform sampler2D uTex;" +
               "void main(){ gl_FragColor = texture2D(uTex, vUV); }";
    function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }

    function setup(img) {
      
      const c2 = document.createElement("canvas"); c2.width = IW; c2.height = IH;
      const x2 = c2.getContext("2d"); x2.drawImage(img, 0, 0);
      const data = x2.getImageData(0, 0, IW, IH).data;
      const has = new Uint8Array(COLS * ROWS);
      for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
        let hit = 0;
        for (let y = j * CELL; y < Math.min(IH, (j + 1) * CELL) && !hit; y += 3)
          for (let x = i * CELL; x < Math.min(IW, (i + 1) * CELL); x += 3)
            if (data[(y * IW + x) * 4 + 3] > 6) { hit = 1; break; }
        has[j * COLS + i] = hit;
      }
      const idx = [];
      for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
        let on = false;
        for (let dj = -1; dj <= 1 && !on; dj++) for (let di = -1; di <= 1; di++) {
          const jj = j + dj, ii = i + di;
          if (jj >= 0 && ii >= 0 && jj < ROWS && ii < COLS && has[jj * COLS + ii]) { on = true; break; }
        }
        if (!on) continue;
        const a = j * (COLS + 1) + i, b = a + 1, c = a + COLS + 1, d = c + 1;
        idx.push(a, b, c, b, d, c);
      }
      indexCount = idx.length;
      prog = gl.createProgram();
      gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog); gl.useProgram(prog);
      aPos = gl.getAttribLocation(prog, "aPos"); aUV = gl.getAttribLocation(prog, "aUV");
      locView = gl.getUniformLocation(prog, "uView");
      pbuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, pbuf); gl.bufferData(gl.ARRAY_BUFFER, pos.byteLength, gl.DYNAMIC_DRAW);
      const ubuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, ubuf); gl.bufferData(gl.ARRAY_BUFFER, uvs, gl.STATIC_DRAW);
      gl.enableVertexAttribArray(aUV); gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, 0, 0);
      ibuf = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibuf);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
      tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      if (isGL2) { gl.generateMipmap(gl.TEXTURE_2D); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); }
      else gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      glReady = true;
    }

    function fit() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(10, Math.round(stage.clientWidth * dpr)), h = Math.max(10, Math.round(stage.clientHeight * dpr));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      gl.viewport(0, 0, w, h);
    }

    function render(t) {
      if (!glReady) return;
      const P = pose(t);
      skin(P.Wm);
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.useProgram(prog);
      gl.uniform2f(locView, TW, TH);
      gl.bindBuffer(gl.ARRAY_BUFFER, pbuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, pos);
      gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
      const ubuf = null; void ubuf;
      gl.drawElements(gl.TRIANGLES, indexCount, gl.UNSIGNED_SHORT, 0);
      
      const lift = Math.max(0, -P.dy);
      floor.style.transform = `scale(${1 - lift / 190}, ${1 - lift / 230})`;
      floor.style.opacity = String(1 - lift / 120);
    }

    
    let t0 = performance.now(), running = true;
    const now = () => (performance.now() - t0) / 1000;

    window.addEventListener("mousemove", (e) => { mouse = [e.clientX, e.clientY]; });
    window.addEventListener("touchmove", (e) => { const t = e.touches[0]; if (t) mouse = [t.clientX, t.clientY]; }, { passive: true });
    stage.addEventListener("click", () => { startJump(now(), 46, true); hint.style.opacity = 0; });
   
    function hop() { const t = now(); if (t - lastHop < 1.4 || jump) return; lastHop = t; startJump(t, 16, false); }
    document.querySelectorAll(".c-item").forEach((c) => c.addEventListener("mouseenter", hop));
    window.addEventListener("char-happy", () => { jump = null; startJump(now(), 28, true); });

    let prev = 0, nextWave = 1.2;
    function frame() {
      if (!running) return;
      const t = now(), dt = Math.min(0.05, t - prev); prev = t;
     
      if (mouse) {
        const r = stage.getBoundingClientRect();
        const cx = r.left + r.width * 0.45;
        headTarget = Math.max(-1, Math.min(1, (mouse[0] - cx) / (window.innerWidth * 0.5))) * 10 * D;
      }
      headCur += (headTarget - headCur) * (1 - Math.exp(-dt * 7));
      
      if (t > nextWave && !jump) { startJump(t, 14, false); nextWave = t + 5 + Math.random() * 3; }
      render(t);
      requestAnimationFrame(frame);
    }
    document.addEventListener("visibilitychange", () => { if (!document.hidden && running) { prev = now(); } });

   
    canvas._render = (t, over) => {
      if (over) { if (over.wave != null) waveStart = over.wave; if (over.head != null) headCur = over.head; if ("jump" in over) jump = over.jump; }
      render(t);
    };

    const img = new Image();
    img.onload = () => {
      setup(img); fit();
      window.addEventListener("resize", fit);
      if (reduce) { render(0); return; }
      t0 = performance.now(); frame();
      setTimeout(() => { hint.style.opacity = 0; }, 9000);
    };
    img.onerror = useFallback;
    img.src = IMG_SRC;
  })();
  </script>
</body>
